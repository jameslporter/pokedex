name: Release mobile apps

# Builds the iOS and Android store binaries on GitHub-hosted runners with
# `eas build --local` (native projects are generated by prebuild, never
# committed), then uploads them to the stores with EAS Submit.
#
# Run it from the Actions tab, or push a tag like v1.0.0 to build and submit
# both platforms. See docs/RELEASING.md for the one-time setup.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: Submit the build to the stores with EAS Submit
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag pushes have no inputs, so they build and submit everything.
  SHOULD_SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile

      - name: Build Android app bundle
        run: >
          eas build --platform android --profile production
          --local --non-interactive --output build/pokedex.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/pokedex.aab
          retention-days: 14

      - name: Submit to Google Play
        if: ${{ env.SHOULD_SUBMIT == 'true' }}
        run: >
          eas submit --platform android --profile production
          --path build/pokedex.aab --non-interactive

  ios:
    if: ${{ github.event_name == 'push' || inputs.platform != 'android' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - run: bun install --frozen-lockfile

      # Local iOS builds need fastlane and CocoaPods. The macOS runner image
      # ships both; this only installs them if a future image drops one.
      - name: Check build tools
        run: |
          xcodebuild -version
          command -v fastlane || brew install fastlane
          command -v pod || brew install cocoapods

      - name: Build iOS app
        run: >
          eas build --platform ios --profile production
          --local --non-interactive --output build/pokedex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/pokedex.ipa
          retention-days: 14

      - name: Submit to App Store Connect (TestFlight)
        if: ${{ env.SHOULD_SUBMIT == 'true' }}
        run: >
          eas submit --platform ios --profile production
          --path build/pokedex.ipa --non-interactive
